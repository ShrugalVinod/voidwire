[package]
name = "vw-cli"
description = "The `voidwire` command-line client for the VoidWire daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voidwire"
path = "src/main.rs"

[lib]
name = "vw_cli"
path = "src/lib.rs"

[dependencies]
anstream = "1.0.0"
clap.workspace = true
clap_complete = "4.6.12"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vw-core.workspace = true
vw-freecloud.workspace = true
vw-tui.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
