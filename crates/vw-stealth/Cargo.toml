[package]
name = "vw-stealth"
description = "VoidWire pluggable transports: native UDP, AmneziaWG, MASQUE/QUIC, TLS-WebSocket and DAITA chaff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vw-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
rand.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tracing.workspace = true
zeroize.workspace = true

futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.28", default-features = false, features = ["ring", "std", "logging"] }
socket2 = { version = "0.6", features = ["all"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
