[package]
name = "vw-freecloud"
description = "VoidWire $0 engine: Cloudflare WARP registrar, free-tier node provisioner, F2F invites, optional Tor bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []

[dependencies]
vw-core.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros"] }
tracing.workspace = true
zeroize.workspace = true
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki-roots = "1.0.12"
socket2 = "0.6.5"
qrcode = "0.15.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
