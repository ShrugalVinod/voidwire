[package]
name = "vw-daemon"
description = "VoidWire privileged client service (voidwired): Iron Dome driver, packet pipeline, optimizer and IPC server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voidwired"
path = "src/main.rs"

[dependencies]
vw-core.workspace = true
vw-crypto.workspace = true
vw-wg.workspace = true
vw-stealth.workspace = true
vw-firewall.workspace = true
vw-dns.workspace = true
vw-freecloud.workspace = true
vw-leakaudit.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
tokio-util = "0.7.20"
hyper = "1.12.0"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["user", "fs", "net"] }

[target.'cfg(windows)'.dependencies]
blake3 = { workspace = true, features = ["pure"] }
windows-service = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
