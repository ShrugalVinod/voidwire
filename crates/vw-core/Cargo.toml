[package]
name = "vw-core"
description = "VoidWire shared types, configs, secrets, IPC protocol and Iron Dome state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "macros"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

# Portable SIMD build on Windows (no C toolchain needed for cross type-checks).
[target.'cfg(windows)'.dependencies]
blake3 = { workspace = true, features = ["pure"] }
