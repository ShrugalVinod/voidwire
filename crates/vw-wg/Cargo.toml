[package]
name = "vw-wg"
description = "VoidWire userspace WireGuard engine (Noise_IKpsk2), TUN devices, cascade, sanitizer and DAITA padding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
blake2 = "0.10"
chacha20poly1305 = "0.10"
rand.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing.workspace = true
tun-rs = { version = "2", features = ["async"] }
vw-core.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize.workspace = true

[dev-dependencies]
boringtun = "0.7"
tokio = { workspace = true, features = ["full"] }
