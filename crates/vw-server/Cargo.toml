[package]
name = "vw-server"
description = "voidwire-node: RAM-only VoidWire exit/relay node with VWCP admission, NAT and attestation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voidwire-node"
path = "src/main.rs"

[dependencies]
vw-core.workspace = true
vw-crypto.workspace = true
vw-wg.workspace = true
vw-stealth.workspace = true
vw-freecloud.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

# Portable SIMD build on Windows (no C toolchain needed for cross type-checks).
[target.'cfg(windows)'.dependencies]
blake3 = { workspace = true, features = ["pure"] }
