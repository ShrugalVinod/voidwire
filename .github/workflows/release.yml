name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub Release:
#   macOS: VoidWire_<ver>_aarch64.dmg, VoidWire_<ver>_x64.dmg
#   Windows 11: VoidWire_<ver>_x64_en-US.msi, VoidWire_<ver>_x64-setup.exe
#   Linux node: voidwire-node-<ver>-{x86_64,aarch64}-linux-musl.tar.gz
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # https://www.wintun.net — signed driver DLL, redistributable.
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build daemon and CLI sidecars
        shell: bash
        run: |
          cargo build --release --locked -p vw-daemon -p vw-cli --target ${{ matrix.target }}
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/voidwired$EXT apps/desktop/src-tauri/binaries/voidwired-${{ matrix.target }}$EXT
          cp target/${{ matrix.target }}/release/voidwire$EXT  apps/desktop/src-tauri/binaries/voidwire-${{ matrix.target }}$EXT

      - name: Fetch and verify Wintun
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINTUN_URL -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun checksum mismatch: $hash" }
          Expand-Archive wintun.zip -DestinationPath wintun
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          Copy-Item wintun/wintun/bin/amd64/wintun.dll apps/desktop/src-tauri/resources/wintun.dll

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Apple signing/notarization only when the secrets exist; empty values
      # would make the bundler try (and fail) to import a blank certificate.
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Apple signing enabled"
          else
            echo "No Apple certificate configured: building an unsigned (ad-hoc) app"
          fi

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: VoidWire ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system:
            - **macOS (Apple Silicon)**: `*_aarch64.dmg`
            - **macOS (Intel)**: `*_x64.dmg`
            - **Windows 11**: `*_x64-setup.exe` or `*_x64_en-US.msi`
            - **Self-hosted exit node (Linux)**: `voidwire-node-*-linux-musl.tar.gz`

            See README.md for first-run steps (unsigned builds need a one-time approval on macOS and Windows).
          releaseDraft: false
          prerelease: false

  node:
    name: voidwire-node (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: desktop
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static node binary
        run: cross build --release --locked -p vw-server --target ${{ matrix.target }}
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.target }}"; ARCH="${ARCH%%-*}"
          NAME="voidwire-node-${VER}-${ARCH}-linux-musl"
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/voidwire-node "$NAME/"
          cp -r deploy/free-tier "$NAME/deploy"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" voidwire-node-*.tar.gz voidwire-node-*.sha256 --clobber
