[package]
name = "voidwire-desktop"
version = "0.1.3"
description = "VoidWire desktop shell: Tauri v2 bridge to the voidwired IPC protocol"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ShrugalVinod/voidwire"
rust-version = "1.85"
publish = false

[lib]
name = "voidwire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voidwire-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
vw-core = { path = "../../../crates/vw-core" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
